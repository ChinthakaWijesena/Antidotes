name: Build and Release Windows Installer

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_test:
    name: Analyze, Test & Build Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run Unit & Widget Tests
        run: flutter test --no-pub

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Compile Inno Setup Installer
        shell: powershell
        run: |
          $iscc = @(
            "C:\Program Files\Inno Setup 7\ISCC.exe",
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          & $iscc installer\antidotes_setup.iss

      - name: Upload Installer Artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: antidotes-windows-installer
          path: build\installer\Antidotes-Setup-*.exe
          retention-days: 14

      # ------------------------------------------------------------------
      # Optional: SignPath Foundation Code Signing (Uncomment after approval)
      # ------------------------------------------------------------------
      # - name: Submit Signing Request to SignPath
      #   if: startsWith(github.ref, 'refs/tags/v')
      #   uses: signpath/github-action-submit-signing-request@v2
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: 'YOUR_SIGNPATH_ORG_ID'
      #     project-slug: 'antidotes'
      #     signing-policy-slug: 'release-signing'
      #     artifact-configuration-slug: 'default'
      #     github-artifact-id: ${{ steps.upload_artifact.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: 'build\signed-installer'

      - name: Attach Installer to GitHub Release (on Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build\installer\Antidotes-Setup-*.exe
          generate_release_notes: true
